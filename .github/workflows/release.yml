# De-Sentry release builds: engine + desktop app + installers, on every tag.
#
# Push a tag (`git tag v1.0.0 && git push origin v1.0.0`) and this produces a
# draft GitHub Release with the installers attached: MSI (Windows), .dmg
# (macOS), AppImage/.deb (Linux). No toolchain needed on the user's machine.
#
# Windows builds on MSVC (the supported Tauri path); the GNU MinGW toolchain
# works locally for development but cannot link the mobile `cdylib` target,
# so CI stays on MSVC everywhere. The Tauri bundler self-provisions WiX.
name: Release

on:
  push:
    tags:
      - "v*"
      - "V*"
  workflow_dispatch:

jobs:
  build-engine-test:
    # The engine and its suites gate the release: no installer is produced
    # from a tree whose tests are red.
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja openssl@3 pkg-config
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV

      - name: Configure and build the engine
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build --config RelWithDebInfo --parallel

      - name: Run the C++ test suites
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure

  release:
    needs: build-engine-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: ubuntu-22.04
            args: ""
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libfuse2

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja openssl@3 pkg-config
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV

      - name: Install Rust (MSVC on Windows)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust targets for macOS arm64
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin

      - name: Build OpenSSL for arm64 cross-compilation
        if: runner.os == 'macOS' && matrix.args == '--target aarch64-apple-darwin'
        shell: bash
        run: |
          # GitHub's macos-latest runner is Intel; Homebrew's OpenSSL is x86_64-only.
          # Build OpenSSL from source for arm64 so the C++ engine can cross-compile.
          curl -fsSL https://www.openssl.org/source/openssl-3.4.0.tar.gz | tar xz -C /tmp
          cd /tmp/openssl-3.4.0
          ./Configure darwin64-arm64-cc -no-shared --prefix=/tmp/openssl-arm64 > /dev/null
          make -j"$(sysctl -n hw.ncpu)" > /dev/null
          make install_sw > /dev/null
          echo "OPENSSL_ROOT_DIR=/tmp/openssl-arm64" >> $GITHUB_ENV

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build the engine
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ] && [ "${{ matrix.args }}" = "--target aarch64-apple-darwin" ]; then
            cmake -S . -B build-arm64 -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_OSX_ARCHITECTURES=arm64
            cmake --build build-arm64 --config RelWithDebInfo --parallel
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
            cmake --build build --config RelWithDebInfo --parallel
          fi

      - name: App setup (deps, sizing model, sidecar staging)
        working-directory: app
        env:
          # macOS arm64 cross-build: tell stage-sidecar.mjs to name the sidecar
          # desentryd-aarch64-apple-darwin and source it from build-arm64/
          DESENTRY_SIDECAR_TRIPLE: ${{ matrix.args == '--target aarch64-apple-darwin' && 'aarch64-apple-darwin' || '' }}
          DESENTRY_ENGINE: ${{ matrix.args == '--target aarch64-apple-darwin' && format('{0}/build-arm64/desentryd', github.workspace) || '' }}
        run: |
          npm ci
          npm run fetch-model
          npm run stage-sidecar

      - name: Configure Apple Developer signing secrets
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTAR_PASS: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
          APPLE_NOTAR_TEAM: ${{ secrets.APPLE_NOTARIZATION_TEAM_ID }}
        run: |
          # Strip any linebreaks or whitespace from base64 certificate
          CLEAN_CERT=$(echo "$APPLE_CERT" | tr -d '\r\n ')
          if [ -n "$CLEAN_CERT" ]; then
            echo "APPLE_CERTIFICATE=$CLEAN_CERT" >> $GITHUB_ENV
            if [ -n "$APPLE_CERT_PASS" ]; then
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERT_PASS" >> $GITHUB_ENV
            fi
            if [ -n "$APPLE_NOTAR_PASS" ]; then
              echo "APPLE_NOTARIZATION_PASSWORD=$APPLE_NOTAR_PASS" >> $GITHUB_ENV
              echo "APPLE_PASSWORD=$APPLE_NOTAR_PASS" >> $GITHUB_ENV
            fi
            if [ -n "$APPLE_NOTAR_TEAM" ]; then
              echo "APPLE_NOTARIZATION_TEAM_ID=$APPLE_NOTAR_TEAM" >> $GITHUB_ENV
              echo "APPLE_TEAM_ID=$APPLE_NOTAR_TEAM" >> $GITHUB_ENV
            fi
            echo "Apple Developer signing configured from repository secrets."
          fi

      - name: Build and release the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Minisign key for updater artifacts (M-13). One-time setup: run
          # `npx @tauri-apps/cli signer generate`, keep the private key OUT
          # of the repo, store it as this secret. Without it the release
          # still builds, but updater bundles are unsigned and clients refuse
          # them -- fail closed, never silently unsigned.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # macOS arm64 cross-build: tell stage-sidecar.mjs (run by
          # beforeBuildCommand) to name the sidecar desentryd-aarch64-apple-darwin
          # and source it from the cross-built engine in build-arm64/.
          DESENTRY_SIDECAR_TRIPLE: ${{ matrix.args == '--target aarch64-apple-darwin' && 'aarch64-apple-darwin' || '' }}
          DESENTRY_ENGINE: ${{ matrix.args == '--target aarch64-apple-darwin' && format('{0}/build-arm64/desentryd', github.workspace) || '' }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "De-Sentry ${{ github.ref_name }}"
          releaseBody: "See STATUS.md for what was verified in this build."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Fix macOS DMG (hdiutil workaround)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Tauri's hdiutil create fails; rebuild with makehybrid
          # Use the workaround from STATUS.md
          shopt -s nullglob
          for dmg in app/src-tauri/target/release/bundle/dmg/*.dmg app/src-tauri/target/*/release/bundle/dmg/*.dmg; do
            [ -f "$dmg" ] || continue
            base="$(basename "$dmg" .dmg)"
            dir="$(dirname "$dmg")"
            hdiutil convert "$dmg" -format UDZO -o "${dir}/${base}-fixed.dmg"
            mv "${dir}/${base}-fixed.dmg" "$dmg"
          done
