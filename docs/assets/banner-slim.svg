<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 120" width="1280" height="120" role="img" aria-label="De-Sentry documentation">
  <title>De-Sentry</title>

  <defs>
    <linearGradient id="docbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07080c"/>
      <stop offset="60%" stop-color="#0b0e16"/>
      <stop offset="100%" stop-color="#0d0a14"/>
    </linearGradient>
    <linearGradient id="docaccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2997ff"/>
      <stop offset="55%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#bd00ff"/>
    </linearGradient>
    <radialGradient id="dochalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2997ff" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="docglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="docgrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <linearGradient id="sentry-grad-shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071e3" />
      <stop offset="100%" stop-color="#004085" />
    </linearGradient>
    <linearGradient id="sentry-grad-glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#2997ff" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#0071e3" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="sentry-grad-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#64d2ff" />
      <stop offset="100%" stop-color="#0071e3" stop-opacity="0" />
    </radialGradient>
    <clipPath id="docframe"><rect width="1280" height="120" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#docframe)">
    <rect width="1280" height="120" fill="url(#docbg)"/>
    <rect width="1280" height="120" fill="url(#docgrid)"/>
    <ellipse cx="1090" cy="60" rx="300" ry="130" fill="url(#dochalo)"/>

    <!-- constellation -->
    <g opacity="0.8">
      <g stroke="url(#docaccent)" stroke-width="1" opacity="0.35" fill="none">
        <path d="M900 84 L968 34 L1046 66 L1104 22"/>
        <path d="M968 34 L1010 92 L1104 74"/>
      </g>
      <g filter="url(#docglow)">
        <circle cx="900" cy="84" r="3.4" fill="#2997ff"/>
        <circle cx="968" cy="34" r="4" fill="#00f0ff"/>
        <circle cx="1046" cy="66" r="3" fill="#9fd0ff"/>
        <circle cx="1104" cy="22" r="3.2" fill="#bd00ff"/>
        <circle cx="1010" cy="92" r="3.4" fill="#2997ff"/>
        <circle cx="1104" cy="74" r="2.8" fill="#00f0ff"/>
      </g>
    </g>

    <!-- Sentry Aegis Brand Mark -->
    <g transform="translate(44 16) scale(0.85)">
      <path d="M50 8 L85 22.5 C85 55 70 78 50 92 C30 78 15 55 15 22.5 Z" fill="#2997ff" opacity="0.25" filter="url(#docglow)"/>
      <path d="M50 8 L85 22.5 C85 55 70 78 50 92 C30 78 15 55 15 22.5 Z" fill="url(#sentry-grad-shield)" stroke="#2997ff" stroke-width="2" stroke-linejoin="round"/>
      <path d="M50 8 L15 22.5 C15 55 30 78 50 92 L50 50 Z" fill="url(#sentry-grad-glow)"/>
      <g stroke="#ffffff" stroke-width="1.75" stroke-opacity="0.65" stroke-linecap="round">
        <line x1="50" y1="28" x2="70" y2="60"/>
        <line x1="70" y1="60" x2="30" y2="60"/>
        <line x1="30" y1="60" x2="50" y2="28"/>
        <line x1="50" y1="28" x2="50" y2="49"/>
        <line x1="70" y1="60" x2="50" y2="49"/>
        <line x1="30" y1="60" x2="50" y2="49"/>
      </g>
      <g fill="#ffffff" filter="url(#docglow)">
        <circle cx="50" cy="28" r="4.5"/>
        <circle cx="70" cy="60" r="4.5"/>
        <circle cx="30" cy="60" r="4.5"/>
      </g>
      <circle cx="50" cy="49" r="12" fill="url(#sentry-grad-core)" filter="url(#docglow)"/>
      <polygon points="50,42 55,49 50,56 45,49" fill="#ffffff"/>
    </g>

    <text x="136" y="56" font-family="'SF Pro Display', 'Segoe UI Variable Display', 'Segoe UI', Inter, system-ui, sans-serif"
          font-size="30" font-weight="700" letter-spacing="-0.8" fill="#f5f5f7">De-Sentry</text>
    <text x="136" y="82" font-family="'SF Pro Text', 'Segoe UI Variable Text', 'Segoe UI', Inter, system-ui, sans-serif"
          font-size="12.5" fill="#8e8e93" letter-spacing="1.6">DECENTRALIZED · PEER-TO-PEER · DATABASE ENGINE</text>

    <rect x="0" y="118" width="1280" height="2" fill="url(#docaccent)" opacity="0.7"/>
  </g>

  <rect x="0.6" y="0.6" width="1278.8" height="118.8" rx="15.4" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
</svg>
