<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="De-Sentry — a decentralized peer-to-peer database engine">
  <title>De-Sentry</title>
  <desc>A decentralized, fully peer-to-peer database engine. No coordinator. No leader. No single point of failure.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07080c"/>
      <stop offset="55%" stop-color="#0b0e16"/>
      <stop offset="100%" stop-color="#0d0a14"/>
    </linearGradient>

    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f5f7"/>
      <stop offset="100%" stop-color="#9fd0ff"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2997ff"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#bd00ff"/>
    </linearGradient>

    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2997ff" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#bd00ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.055"/>
    </pattern>

    <clipPath id="frame">
      <rect x="0" y="0" width="1280" height="320" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- base -->
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#grid)"/>

    <!-- ambient halos -->
    <ellipse cx="1010" cy="150" rx="330" ry="230" fill="url(#halo)"/>
    <ellipse cx="160" cy="40" rx="260" ry="160" fill="#2997ff" opacity="0.05" filter="url(#softGlow)"/>

    <!-- mesh constellation -->
    <g opacity="0.85">
      <g stroke="url(#accent)" stroke-width="1.1" opacity="0.42" fill="none">
        <path d="M852 214 L944 118 L1058 168 L1124 86"/>
        <path d="M944 118 L1020 226 L1124 196 L1058 168"/>
        <path d="M1020 226 L1124 86"/>
        <path d="M852 214 L1020 226"/>
        <path d="M944 118 L1124 196"/>
      </g>

      <!-- moving packets -->
      <circle r="2.6" fill="#00f0ff" filter="url(#glow)">
        <animateMotion dur="7s" repeatCount="indefinite" path="M852 214 L944 118 L1058 168 L1124 86"/>
      </circle>
      <circle r="2.2" fill="#bd00ff" filter="url(#glow)">
        <animateMotion dur="9s" repeatCount="indefinite" path="M944 118 L1020 226 L1124 196"/>
      </circle>
      <circle r="2" fill="#2997ff" filter="url(#glow)">
        <animateMotion dur="11s" repeatCount="indefinite" path="M1124 86 L1058 168 L1020 226 L852 214"/>
      </circle>

      <!-- nodes -->
      <g filter="url(#glow)">
        <circle cx="852" cy="214" r="5.5" fill="#2997ff"/>
        <circle cx="944" cy="118" r="6.5" fill="#00f0ff"/>
        <circle cx="1058" cy="168" r="4.5" fill="#9fd0ff"/>
        <circle cx="1124" cy="86" r="5" fill="#bd00ff"/>
        <circle cx="1020" cy="226" r="5.5" fill="#2997ff"/>
        <circle cx="1124" cy="196" r="4" fill="#00f0ff"/>
      </g>

      <!-- slow-breathing outer rings -->
      <g fill="none" stroke="#2997ff" stroke-width="1" opacity="0.30">
        <circle cx="944" cy="118" r="16">
          <animate attributeName="r" values="12;24;12" dur="6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.45;0;0.45" dur="6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="1020" cy="226" r="16">
          <animate attributeName="r" values="12;24;12" dur="7.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.35;0;0.35" dur="7.5s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>

    <!-- emblem -->
    <g transform="translate(84 96)">
      <circle cx="44" cy="44" r="42" fill="none" stroke="url(#accent)" stroke-width="1.6" opacity="0.75"/>
      <circle cx="44" cy="44" r="31" fill="none" stroke="#2997ff" stroke-width="1" opacity="0.35"/>
      <g filter="url(#glow)">
        <circle cx="44" cy="44" r="12" fill="none" stroke="#00f0ff" stroke-width="2.2"/>
        <circle cx="44" cy="44" r="4.2" fill="#00f0ff"/>
      </g>
      <g fill="#9fd0ff">
        <circle cx="44" cy="6" r="2.6"/>
        <circle cx="77" cy="25" r="2.2"/>
        <circle cx="77" cy="63" r="2.6"/>
        <circle cx="44" cy="82" r="2.2"/>
        <circle cx="11" cy="63" r="2.6"/>
        <circle cx="11" cy="25" r="2.2"/>
      </g>
      <g stroke="#2997ff" stroke-width="0.9" opacity="0.45">
        <path d="M44 6 L44 32"/>
        <path d="M77 25 L62 38"/>
        <path d="M77 63 L62 50"/>
        <path d="M44 82 L44 56"/>
        <path d="M11 63 L26 50"/>
        <path d="M11 25 L26 38"/>
      </g>
    </g>

    <!-- wordmark -->
    <text x="196" y="138" font-family="'SF Pro Display', 'Segoe UI Variable Display', 'Segoe UI', Inter, system-ui, sans-serif"
          font-size="60" font-weight="700" letter-spacing="-1.6" fill="url(#wordmark)">De-Sentry</text>

    <rect x="198" y="158" width="104" height="3" rx="1.5" fill="url(#accent)" opacity="0.9"/>

    <text x="198" y="192" font-family="'SF Pro Text', 'Segoe UI Variable Text', 'Segoe UI', Inter, system-ui, sans-serif"
          font-size="18" font-weight="400" fill="#cccccc" opacity="0.88">Decentralized peer-to-peer database engine</text>

    <text x="198" y="222" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace"
          font-size="13" fill="#8e8e93" letter-spacing="0.4">no coordinator · no leader · no single point of failure</text>

    <!-- chips -->
    <g font-family="'SF Pro Text', 'Segoe UI', Inter, system-ui, sans-serif" font-size="11.5" font-weight="600">
      <g transform="translate(198 246)">
        <rect width="86" height="24" rx="12" fill="#2997ff" fill-opacity="0.12" stroke="#2997ff" stroke-opacity="0.35"/>
        <text x="43" y="16" text-anchor="middle" fill="#9fd0ff" letter-spacing="0.5">C++17</text>
      </g>
      <g transform="translate(292 246)">
        <rect width="96" height="24" rx="12" fill="#bd00ff" fill-opacity="0.12" stroke="#bd00ff" stroke-opacity="0.35"/>
        <text x="48" y="16" text-anchor="middle" fill="#dca6ff" letter-spacing="0.5">CRDT</text>
      </g>
      <g transform="translate(396 246)">
        <rect width="120" height="24" rx="12" fill="#00f0ff" fill-opacity="0.10" stroke="#00f0ff" stroke-opacity="0.30"/>
        <text x="60" y="16" text-anchor="middle" fill="#8ef4ff" letter-spacing="0.5">encrypted P2P</text>
      </g>
      <g transform="translate(524 246)">
        <rect width="104" height="24" rx="12" fill="#30d158" fill-opacity="0.10" stroke="#30d158" stroke-opacity="0.30"/>
        <text x="52" y="16" text-anchor="middle" fill="#9ff0bb" letter-spacing="0.5">offline-first</text>
      </g>
    </g>
  </g>

  <!-- border -->
  <rect x="0.75" y="0.75" width="1278.5" height="318.5" rx="19.25" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
</svg>
