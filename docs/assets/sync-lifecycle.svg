<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 240" width="1080" height="240" role="img" aria-label="De-Sentry Data Mutation and Convergence Lifecycle">
  <title>De-Sentry Data Mutation &amp; Convergence Lifecycle</title>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080a11"/>
      <stop offset="100%" stop-color="#0e1322"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141a29"/>
      <stop offset="100%" stop-color="#0f1422"/>
    </linearGradient>

    <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.75" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>

    <marker id="mArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1080" height="240" rx="16" fill="url(#bg2)"/>
  <rect width="1080" height="240" rx="16" fill="url(#grid2)"/>
  <rect width="1080" height="240" rx="16" fill="none" stroke="#222b40" stroke-width="1.5"/>

  <!-- Top Title -->
  <g transform="translate(36, 26)">
    <rect x="0" y="0" width="156" height="20" rx="10" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.3"/>
    <text x="78" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="0.8">DATA PIPELINE</text>
    <text x="172" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9" letter-spacing="-0.2">Zero-Coordinator Mutation &amp; Anti-Entropy Convergence Lifecycle</text>
  </g>

  <!-- Step 1 -->
  <g transform="translate(36, 62)">
    <rect width="180" height="150" rx="10" fill="url(#cardGrad)" stroke="#222d42" stroke-width="1.2"/>
    <rect x="14" y="12" width="24" height="24" rx="12" fill="#0284c7" fill-opacity="0.2"/>
    <text x="26" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#38bdf8" text-anchor="middle">1</text>
    <text x="48" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Local Ingest</text>
    
    <text x="16" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">• HTTP / REST API</text>
    <text x="16" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">• Write-Ahead Log</text>
    <text x="16" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">• Slotted Page Write</text>
    <rect x="14" y="112" width="152" height="24" rx="6" fill="#1e293b"/>
    <text x="90" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#38bdf8" text-anchor="middle">Immediate Durability</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <path d="M 216 137 L 236 137" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#mArrow)"/>

  <!-- Step 2 -->
  <g transform="translate(244, 62)">
    <rect width="180" height="150" rx="10" fill="url(#cardGrad)" stroke="#222d42" stroke-width="1.2"/>
    <rect x="14" y="12" width="24" height="24" rx="12" fill="#10b981" fill-opacity="0.2"/>
    <text x="26" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#34d399" text-anchor="middle">2</text>
    <text x="48" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Causal Ordering</text>

    <text x="16" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">• HLC Clock Tick</text>
    <text x="16" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">• CRDT State Wrap</text>
    <text x="16" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">• Tombstone Tracking</text>
    <rect x="14" y="112" width="152" height="24" rx="6" fill="#1e293b"/>
    <text x="90" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#34d399" text-anchor="middle">Physical + Logical Clock</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <path d="M 424 137 L 444 137" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#mArrow)"/>

  <!-- Step 3 -->
  <g transform="translate(452, 62)">
    <rect width="180" height="150" rx="10" fill="url(#cardGrad)" stroke="#222d42" stroke-width="1.2"/>
    <rect x="14" y="12" width="24" height="24" rx="12" fill="#a855f7" fill-opacity="0.2"/>
    <text x="26" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#c084fc" text-anchor="middle">3</text>
    <text x="48" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Cryptographic Seal</text>

    <text x="16" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">• Ed25519 Signature</text>
    <text x="16" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">• SHA-256 Hash Chain</text>
    <text x="16" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">• Append-Only Log</text>
    <rect x="14" y="112" width="152" height="24" rx="6" fill="#1e293b"/>
    <text x="90" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#c084fc" text-anchor="middle">Tamper-Evident Audit</text>
  </g>

  <!-- Connector 3 -> 4 -->
  <path d="M 632 137 L 652 137" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#mArrow)"/>

  <!-- Step 4 -->
  <g transform="translate(660, 62)">
    <rect width="180" height="150" rx="10" fill="url(#cardGrad)" stroke="#222d42" stroke-width="1.2"/>
    <rect x="14" y="12" width="24" height="24" rx="12" fill="#00f0ff" fill-opacity="0.15"/>
    <text x="26" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#00f0ff" text-anchor="middle">4</text>
    <text x="48" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Mesh Transport</text>

    <text x="16" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">• Consistent Hashing (RF)</text>
    <text x="16" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">• X25519 Handshake</text>
    <text x="16" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">• AES-256-GCM Frame</text>
    <rect x="14" y="112" width="152" height="24" rx="6" fill="#1e293b"/>
    <text x="90" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#00f0ff" text-anchor="middle">Authenticated Gossip</text>
  </g>

  <!-- Connector 4 -> 5 -->
  <path d="M 840 137 L 860 137" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#mArrow)"/>

  <!-- Step 5 -->
  <g transform="translate(868, 62)">
    <rect width="176" height="150" rx="10" fill="url(#cardGrad)" stroke="#222d42" stroke-width="1.2"/>
    <rect x="14" y="12" width="24" height="24" rx="12" fill="#ec4899" fill-opacity="0.2"/>
    <text x="26" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#f472b6" text-anchor="middle">5</text>
    <text x="48" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Convergence</text>

    <text x="16" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">• Signature Verification</text>
    <text x="16" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">• CRDT State Join (LWW)</text>
    <text x="16" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">• Storage Engine Commit</text>
    <rect x="14" y="112" width="148" height="24" rx="6" fill="#1e293b"/>
    <text x="88" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#f472b6" text-anchor="middle">Mesh State Reached</text>
  </g>
</svg>
