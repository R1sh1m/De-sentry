<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <radialGradient id="glow-primary" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#0071e3" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0071e3" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-accent" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#64d2ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#64d2ff" stop-opacity="0" />
    </radialGradient>
    <!-- Shield Logo Gradients -->
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071e3" />
      <stop offset="100%" stop-color="#00356b" />
    </linearGradient>
    <radialGradient id="shield-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#64d2ff" />
      <stop offset="100%" stop-color="#0071e3" stop-opacity="0" />
    </radialGradient>
    <!-- Card Border Effect -->
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2997ff" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0071e3" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow-primary)" />
  <rect width="1200" height="630" fill="url(#glow-accent)" />

  <!-- Outer Safe-Zone Border -->
  <rect x="30" y="30" width="1140" height="570" rx="28" fill="none" stroke="url(#card-border)" stroke-width="1.5" />

  <!-- Grid Mesh Accents -->
  <g stroke="#2997ff" stroke-opacity="0.07" stroke-width="1">
    <line x1="80" y1="160" x2="1120" y2="160" />
    <line x1="80" y1="320" x2="1120" y2="320" />
    <line x1="80" y1="480" x2="1120" y2="480" />
    <line x1="300" y1="60" x2="300" y2="570" />
    <line x1="600" y1="60" x2="600" y2="570" />
    <line x1="900" y1="60" x2="900" y2="570" />
  </g>

  <!-- Left Content Zone (Safe Margin x=80, y=90) -->
  <g transform="translate(80, 90)">
    <!-- Pill Category Badge (supahero.io pattern) -->
    <rect x="0" y="0" width="280" height="34" rx="17" fill="#0071e3" fill-opacity="0.18" stroke="#2997ff" stroke-opacity="0.4" stroke-width="1" />
    <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#64d2ff" letter-spacing="1.5">VERIFIED P2P DATABASE MESH</text>

    <!-- Main Title -->
    <text x="0" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">De-Sentry</text>

    <!-- Subtitle (Value Proposition) -->
    <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="500" fill="#94a3b8" letter-spacing="-0.5">
      The peer-to-peer database mesh with zero cloud dependencies.
    </text>
    <text x="0" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#64748b">
      Forms, replicates, and serves on laptops in airplane mode.
    </text>

    <!-- Trust Feature Badges (socialproofexamples.com pattern) -->
    <g transform="translate(0, 260)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="165" height="42" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">✈️ 100% Offline</text>

      <!-- Badge 2 -->
      <rect x="180" y="0" width="175" height="42" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">⚡ CRDT Ledger</text>

      <!-- Badge 3 -->
      <rect x="370" y="0" width="180" height="42" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">🔒 Encrypted Mesh</text>

      <!-- Badge 4 -->
      <rect x="565" y="0" width="170" height="42" rx="10" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">🚀 Zero Config</text>
    </g>

    <!-- Version & Open Source Footprint -->
    <text x="0" y="360" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="500" fill="#475569">
      Release v1.2.0 · C++17 Core · Tauri Sidecar · MIT License
    </text>
  </g>

  <!-- Right Visual Zone: Geometric Shield Logo Artifact (x=900, y=280) -->
  <g transform="translate(920, 280) scale(2.6)">
    <path d="M0 -70 L60 -45 C60 10 35 50 0 74 C-35 50 -60 10 -60 -45 Z" fill="url(#shield-grad)" stroke="#2997ff" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M0 -70 L-60 -45 C-60 10 -35 50 0 74 L0 0 Z" fill="#2997ff" fill-opacity="0.25" />
    <!-- Constellation Web -->
    <g stroke="#ffffff" stroke-width="2.2" stroke-opacity="0.65" stroke-linecap="round">
      <line x1="0" y1="-36" x2="35" y2="18" />
      <line x1="35" y1="18" x2="-35" y2="18" />
      <line x1="-35" y1="18" x2="0" y2="-36" />
      <line x1="0" y1="-36" x2="0" y2="0" />
      <line x1="35" y1="18" x2="0" y2="0" />
      <line x1="-35" y1="18" x2="0" y2="0" />
    </g>
    <circle cx="0" cy="-36" r="6" fill="#ffffff" />
    <circle cx="35" cy="18" r="6" fill="#ffffff" />
    <circle cx="-35" cy="18" r="6" fill="#ffffff" />
    <circle cx="0" cy="0" r="16" fill="url(#shield-core)" />
    <polygon points="0,-10 7,0 0,10 -7,0" fill="#ffffff" />
  </g>
</svg>
