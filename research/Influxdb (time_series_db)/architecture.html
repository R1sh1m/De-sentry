<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InfluxDB — Interactive Architecture</title>
<style>
  :root { --bg:#0f1420; --card:#1a2233; --accent:#4f9cf9; --txt:#e6edf6; --muted:#9fb0c3; --line:#2c3a52; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt); }
  header { padding:24px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:22px; }
  .badge { display:inline-block; margin-top:8px; padding:4px 10px; border-radius:999px; background:var(--accent); color:#06121f; font-size:12px; font-weight:600; }
  .layout { display:flex; flex-wrap:wrap; gap:20px; padding:24px; align-items:flex-start; }
  .diagram { flex:1 1 420px; }
  .layer { margin-bottom:14px; }
  .layer h3 { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; }
  .row { display:flex; flex-wrap:wrap; gap:10px; }
  .comp { cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--txt); padding:12px 14px; border-radius:10px; font-size:13px; text-align:left; transition:.15s; }
  .comp:hover, .comp.active { border-color:var(--accent); box-shadow:0 0 0 2px rgba(79,156,249,.25); }
  .connector { height:20px; width:2px; background:var(--line); margin:0 auto; }
  aside#panel { flex:1 1 320px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; min-height:260px; position:sticky; top:24px; }
  aside#panel h2 { margin-top:0; font-size:16px; color:var(--accent); }
  aside#panel p { color:var(--muted); line-height:1.55; font-size:14px; }
  .toggle { display:flex; gap:8px; margin:0 0 14px; }
  .toggle button { background:var(--card); border:1px solid var(--line); color:var(--txt); padding:6px 12px; border-radius:8px; cursor:pointer; }
  .toggle button.active { border-color:var(--accent); color:var(--accent); }
  footer { padding:16px 24px; color:var(--muted); font-size:12px; border-top:1px solid var(--line); }
  code { background:#0b0f18; padding:1px 5px; border-radius:4px; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>InfluxDB — Interactive Architecture</h1>
  <span class="badge">Time-series database</span>
</header>
<div class="layout">
  <div class="diagram">
    <div class="layer">
      <h3>Client tier</h3>
      <div class="row">
        <button class="comp" data-key="telegraf">Telegraf / agents</button>
        <button class="comp" data-key="clientlibs">Client libraries</button>
        <button class="comp" data-key="lineproto">Line protocol</button>
        <button class="comp" data-key="sqlclients">SQL clients</button>
      </div>
    </div>
    <div class="connector"></div>
    <div class="layer">
      <h3>Ingest tier</h3>
      <div class="row">
        <button class="comp" data-key="writeapi">Write API</button>
        <button class="comp" data-key="ingester">Ingester</button>
        <button class="comp" data-key="wal">Write-Ahead Log</button>
        <button class="comp" data-key="objstore">Object storage</button>
      </div>
    </div>
    <div class="connector"></div>
    <div class="layer">
      <h3>Query tier</h3>
      <div class="row">
        <button class="comp" data-key="queryengine">Query engine (DataFusion + Arrow)</button>
        <button class="comp" data-key="sql">SQL</button>
        <button class="comp" data-key="influxql">InfluxQL</button>
      </div>
    </div>
    <div class="connector"></div>
    <div class="layer">
      <h3>Storage tier</h3>
      <div class="row">
        <button class="comp" data-key="engine3">InfluxDB 3 storage engine</button>
        <button class="comp" data-key="tsm">TSM (v2)</button>
        <button class="comp" data-key="shards">Time-partitioned shards</button>
        <button class="comp" data-key="parquet">Parquet / Arrow</button>
        <button class="comp" data-key="index">Time + tag index</button>
        <button class="comp" data-key="retention">Retention</button>
      </div>
    </div>

    <div class="toggle">
      <button data-path="write" class="active">Write path</button>
      <button data-path="read">Read path</button>
    </div>
  </div>

  <aside id="panel">
    <h2 id="p-title">Overview</h2>
    <p id="p-body">Click any component to see what it does. Use the Write/Read path toggle to trace a request.</p>
  </aside>
</div>
<footer>Generated from Research_Docs • InfluxDB • interactive architecture viewer</footer>
<script>
  const info = {
    telegraf:   { title: "Telegraf / agents", body: "Reference collector/agent that gathers metrics and emits line protocol to the Write API. Common for infrastructure and app monitoring." },
    clientlibs: { title: "Client libraries", body: "Language SDKs (Go, Python, Java, etc.) and HTTP clients that serialize points and send queries." },
    lineproto:  { title: "Line protocol", body: "The text wire format: <measurement>,<tags> <fields> <timestamp>. Compact and fast to parse; the primary ingest format." },
    sqlclients: { title: "SQL clients", body: "Any SQL tool can query v3 (DataFusion) over the SQL API. Grafana and JDBC/ODBC-style clients work." },
    writeapi:   { title: "Write API", body: "HTTP endpoint (v3: /api/v3/write, v2: /api/v2/write) that accepts line protocol points and hands them to the ingester." },
    ingester:   { title: "Ingester", body: "Parses incoming points, routes them to the correct time-based shard, writes the WAL for durability, then persists Parquet/Arrow to object storage." },
    wal:        { title: "Write-Ahead Log", body: "Durable local log. The write is acknowledged once it is in the WAL, decoupling fast ingest from slower object-storage persistence." },
    objstore:   { title: "Object storage", body: "System of record for v3 (S3-compatible or local file store). Holds Parquet/Arrow shards. Capacity scales independently of compute." },
    queryengine:{ title: "Query engine (DataFusion + Arrow)", body: "Apache DataFusion plans and executes SQL/InfluxQL over Arrow. Pushes down time/tag predicates and prunes columns/partitions." },
    sql:        { title: "SQL", body: "First-class SQL support in v3 via DataFusion. Enables familiar analytics on time-series data." },
    influxql:   { title: "InfluxQL", body: "The classic InfluxQL dialect, supported in both v2 and v3 for backwards-compatible queries." },
    engine3:    { title: "InfluxDB 3 storage engine", body: "v3 engine that compacts buffered points into columnar Parquet/Arrow on object storage. Replaces TSM." },
    tsm:        { title: "TSM (v2)", body: "Time-Structured Merge engine used by v1/v2. Log-structured merge on local filesystem; optimize for append-heavy series with compaction." },
    shards:     { title: "Time-partitioned shards", body: "Data sliced by time range. Enables fast retention (drop whole shards) and parallel reads." },
    parquet:    { title: "Parquet / Arrow", body: "Open columnar formats. Parquet on disk, Arrow in memory/over the wire. Column pruning and DataFusion SQL rely on this." },
    index:      { title: "Time + tag index", body: "Index over (time, tags) locates relevant shards/row groups so queries avoid full scans. High tag cardinality is the main cost." },
    retention:  { title: "Retention", body: "Per-database (v3) or per-bucket (v2) policy that deletes shards older than a threshold, keeping storage bounded." }
  };
  const paths = {
    write: "Write path: a line protocol point is POSTed to the Write API -> the ingester validates it and appends to the WAL (ack sent) -> in the background the ingester compacts buffered points and persists Parquet/Arrow to object storage in time-based shards -> the time+tag index is updated.",
    read:  "Read path: a SQL or InfluxQL query hits the query engine -> the planner pushes down time/tag predicates and consults the index -> it reads only the needed Parquet/Arrow columns/partitions from object storage -> results are returned as Arrow batches."
  };
  const pTitle = document.getElementById('p-title');
  const pBody  = document.getElementById('p-body');
  document.querySelectorAll('.comp').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.comp').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    const d = info[b.dataset.key];
    if (d) { pTitle.textContent = d.title; pBody.textContent = d.body; }
  }));
  document.querySelectorAll('.toggle button').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.toggle button').forEach(x => x.classList.remove('active'));
    btn.classList.add('active');
    pTitle.textContent = btn.dataset.path === 'write' ? 'Write path' : 'Read path';
    pBody.textContent = paths[btn.dataset.path];
  }));
</script>
</body>
</html>
